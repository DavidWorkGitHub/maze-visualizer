name: Java checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mkdir -p out && javac --release 8 -d out src/maze/*.java test/maze/*.java
      - run: java -Djava.awt.headless=true -cp out maze.MazeTests
